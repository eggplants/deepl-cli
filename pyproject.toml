[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "deepl-cli"
description = "DeepL Translator CLI without API Key"
readme = "README.md"
keywords = [
  "cli",
  "deepl",
  "deepl-translator",
  "docker",
  "playwright",
  "translate",
  "translation",
  "translator",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "install-playwright>=0.1,<1.1",
  "playwright>=1.49.1,<2",
]
urls.Documentation = "https://egpl.dev/deepl-cli/"
urls.Issues = "https://github.com/eggplants/deepl-cli/issues"
urls.Repository = "https://github.com/eggplants/deepl-cli"
scripts.deepl = "deepl.main:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.include = [ "deepl" ]
build.targets.sdist.include = [ "deepl" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
]
lint.per-file-ignores."examples/*.py" = [
  "D",
  "INP001", # Add an __init__.py.
  "T201",   # `print` found
]
lint.per-file-ignores."main.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."tests/*.py" = [
  "D",
  "E501",   # Line too long (the fixtures quote whole paragraphs of translated text)
  "RUF001", # Ambiguous unicode character (the fixtures carry Russian text)
  "S101",   # Use of assert detected
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
